server:
  port: 8080
 
spring:
  application:
    name: API-GATEWAY
 
  main:
    web-application-type: reactive
 
  cloud:
    gateway:
      routes:
 
        - id: account-service
          uri: lb://ACCOUNT-EUREKA
          predicates:
            - Path=/account/**
 
        - id: customer-service
          uri: lb://CUSTOMER-EUREKA
          predicates:
            - Path=/customer/**
 
        - id: transaction-service
          uri: lb://TRANSACTION-EUREKA
          predicates:
            - Path=/transaction/**
 
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka