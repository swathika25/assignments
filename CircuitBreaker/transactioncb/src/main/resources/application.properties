server.port=8083
spring.application.name=transaction-eureka
spring.datasource.url=jdbc:mysql://localhost:3307/wiprodb
spring.datasource.username=root
spring.datasource.password=Swathika@25
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=*
 
resilience4j.circuitbreaker.instances.transactionBreaker.failure-rate-threshold=50
 
resilience4j.circuitbreaker.instances.transactionBreaker.minimum-number-of-calls=5
 
resilience4j.circuitbreaker.instances.transactionBreaker.sliding-window-size=10
 
resilience4j.circuitbreaker.instances.transactionBreaker.wait-duration-in-open-state=10s